[project]
name = "reasoner-check"
version = "0.1.0"
description = "OWL consistency check for the OWL artefacts generated by MD-Models from the demonstration Experiment model and the EnzymeML v2 schema."
requires-python = ">=3.11"
dependencies = [
    "mdmodels-core==0.2.11",
    "rdflib>=7.0",
    "owlready2>=0.46",
    "owlrl>=7.1.1",
]

[tool.uv]
package = false

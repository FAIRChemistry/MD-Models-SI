name: md-models-demo

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    command: ['mdmodels', 'init', '--config', 'config.toml']

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - '${API_HOST_PORT:-8800}:8800'

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - '${MCP_HOST_PORT:-7001}:7000'

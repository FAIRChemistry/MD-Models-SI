id: md
name: Model Specification
title: Model Specification
default_prefix: md
default_range: string
imports:
- linkml:types
classes:
  Experiment:
    description: A single experiment represents a complete biological assay or reaction study, capturing all the essential components and parameters needed to reproduce and analyze the experimental results. Each experiment serves as a discrete unit of scientific investigation with defined inputs, conditions, and measurable outcomes.
    tree_root: true
    attributes:
      name:
        description: A unique identifier or descriptive name for the experiment
      description:
        description: Detailed description of the experimental procedure, objectives, and expected outcomes
      molecules:
        description: Array of all chemical compounds involved in the reaction (substrates, products, cofactors, inhibitors)
        range: Molecule
        multivalued: true
      enzymes:
        description: Array of all enzymes used as catalysts in the experiment
        range: Enzyme
        multivalued: true
      conditions:
        description: Environmental parameters under which the experiment is conducted
        range: Conditions
  Molecule:
    description: A molecule represents a chemical compound or substrate involved in the biological reaction, including both reactants and products. This encompasses small molecules, cofactors, inhibitors, and any other chemical species that participate in or influence the enzymatic process.
    attributes:
      name:
        description: Chemical name or identifier (IUPAC name, common name, or database ID)
      initial_concentration:
        description: Starting concentration of the molecule in the reaction mixture (typically in mM or μM)
        range: float
      role:
        description: Role of the molecule in the reaction (substrate, product, cofactor, inhibitor)
        range: Role
  Enzyme:
    description: An enzyme is a biological catalyst, typically a protein, that facilitates and accelerates specific chemical reactions by lowering the activation energy required. Enzymes are highly specific to their substrates and play crucial roles in metabolic pathways and biotechnological applications.
    attributes:
      name:
        description: Enzyme name, EC number, or protein identifier from databases like UniProt
      initial_concentration:
        description: Starting concentration of the enzyme in the reaction mixture (typically in mg/mL or μM)
        range: float
      role:
        description: Role of the enzyme in the reaction (enzyme, cofactor, inhibitor)
        range: Role
  Conditions:
    description: Conditions encompass the critical environmental and physical parameters that govern the experimental setup and directly influence enzyme activity, reaction kinetics, and overall experimental outcomes. These parameters must be carefully controlled and documented for reproducible results.
    attributes:
      temperature:
        description: Temperature of the reaction mixture (typically in °C)
        range: float
      pH:
        description: pH of the reaction mixture (typically in pH units)
        range: float
enums:
  Role:
    permissible_values:
      COFACTOR:
        meaning: cofactor
        description: cofactor
      ENZYME:
        meaning: enzyme
        description: enzyme
      INHIBITOR:
        meaning: inhibitor
        description: inhibitor
      PRODUCT:
        meaning: product
        description: product
      SUBSTRATE:
        meaning: substrate
        description: substrate
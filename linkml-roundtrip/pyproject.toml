[project]
name = "linkml-roundtrip"
version = "0.1.0"
description = "LinkML export round-trip for the demonstration Experiment model and the EnzymeML v2 schema. Reports which modelling features survive an MD-Models to LinkML conversion when the result is read back with the LinkML runtime."
requires-python = ">=3.11"
dependencies = [
    "mdmodels-core==0.2.11",
    "linkml-runtime>=1.8",
]

[tool.uv]
package = false
